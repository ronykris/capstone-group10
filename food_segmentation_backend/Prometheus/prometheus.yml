global:
  scrape_interval: 15s
  evaluation_interval: 20s
scrape_configs:
  
  - job_name: "prometheus"
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["13.55.210.195:9090"] 
  
  - job_name: "workflow-model"
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["13.55.210.195:8009"]
